<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icore Speech</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1>Icore Speech</h1>
      <p>صفحة تجربة محلية: صوت إلى نص، ونص إلى صوت.</p>
    </div>
    <div class="token-field">
      <label for="api-token">API token · من ملف <bdi>.env</bdi></label>
      <input id="api-token" class="ltr" type="password" autocomplete="off" placeholder="ICORE_API_TOKEN">
    </div>
  </header>

  <div class="panels">
    <section class="panel" aria-labelledby="transcribe-title">
      <h2 id="transcribe-title">صوت إلى نص</h2>
      <p class="panel-subtitle">سجّل من المايك أو ارفع ملف صوت.</p>
      <div class="field-row">
        <div class="field">
          <label for="transcribe-language">اللغة</label>
          <select id="transcribe-language">
            <option value="ar">عربي</option>
            <option value="en">إنجليزي</option>
            <option value="auto">تحديد تلقائي</option>
          </select>
        </div>
        <div class="field">
          <label for="transcribe-file">ملف صوت</label>
          <input id="transcribe-file" type="file" accept="audio/*,video/mp4,.webm">
        </div>
      </div>
      <label class="checkbox"><input id="transcribe-timestamps" type="checkbox"> أوقات كل جملة (timestamps)</label>
      <div class="actions">
        <button id="record-button" type="button">ابدأ التسجيل</button>
        <button id="transcribe-button" type="button" class="primary">فرّغ الملف</button>
      </div>
      <div id="transcribe-result" class="result" data-placeholder="النص هيظهر هنا"></div>
      <div id="transcribe-status" class="status" role="status"></div>
    </section>

    <section class="panel" aria-labelledby="speak-title">
      <h2 id="speak-title">نص إلى صوت</h2>
      <p class="panel-subtitle">اكتب النص واسمعه، أو نزّله كملف.</p>
      <div class="field">
        <label for="speak-text">النص</label>
        <textarea id="speak-text" maxlength="1000">أهلاً بيك في آي كور سوفت. إزاي نقدر نساعدك النهارده؟</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="speak-language">اللغة</label>
          <select id="speak-language">
            <option value="ar">عربي</option>
            <option value="en">إنجليزي</option>
          </select>
        </div>
        <div class="field">
          <label for="speak-voice">الصوت</label>
          <select id="speak-voice"></select>
        </div>
        <div class="field">
          <label for="speak-format">الصيغة</label>
          <select id="speak-format">
            <option value="mp3">mp3</option>
            <option value="wav">wav</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="speak-button" type="button" class="primary">حوّل لصوت</button>
        <a id="speak-download" class="button-link" hidden download>نزّل الملف</a>
        <button id="speak-transcribe" type="button" hidden>فرّغ الصوت ده</button>
      </div>
      <audio id="speak-player" controls hidden></audio>
      <div id="speak-status" class="status" role="status"></div>
    </section>
  </div>
</main>

<script type="module">
  import { byId, bindTokenInput, setStatus, errorMessage, MicrophoneRecorder } from "/static/common.js";

  const authHeaders = bindTokenInput(byId("api-token"));

  // Voices of the active TTS engine, filtered by the chosen language.
  let voices = [];
  function renderVoices() {
    const language = byId("speak-language").value;
    const select = byId("speak-voice");
    select.replaceChildren(
      ...voices.filter((v) => v.language === language).map((v) => new Option(v.id === "default" ? "الافتراضي" : v.id, v.id))
    );
  }
  async function loadVoices() {
    const response = await fetch("/v1/voices", { headers: authHeaders() });
    if (!response.ok) return;
    voices = (await response.json()).voices;
    renderVoices();
  }
  byId("speak-language").addEventListener("change", renderVoices);
  byId("api-token").addEventListener("change", loadVoices);
  loadVoices();

  // Speech to text
  const transcribeStatus = byId("transcribe-status");
  const transcribeResult = byId("transcribe-result");
  const transcribeButton = byId("transcribe-button");
  const recordButton = byId("record-button");

  async function transcribe(blob, filename) {
    const form = new FormData();
    form.append("file", blob, filename);
    form.append("language", byId("transcribe-language").value);
    form.append("timestamps", byId("transcribe-timestamps").checked);
    transcribeButton.disabled = true;
    transcribeResult.textContent = "";
    setStatus(transcribeStatus, "بيفرّغ...");
    try {
      const response = await fetch("/v1/transcribe", { method: "POST", headers: authHeaders(), body: form });
      if (!response.ok) throw new Error(await errorMessage(response));
      const data = await response.json();
      const lines = [data.text || "(مفيش كلام اتعرف عليه)"];
      if (data.segments) {
        lines.push("", ...data.segments.map((s) => `[${s.start.toFixed(1)} - ${s.end.toFixed(1)}] ${s.text}`));
      }
      transcribeResult.textContent = lines.join("\n");
      setStatus(
        transcribeStatus,
        `${data.model_version} · اللغة ${data.language} · صوت ${data.audio_seconds} ث · معالجة ${(data.processing_ms / 1000).toFixed(1)} ث`
      );
    } catch (error) {
      setStatus(transcribeStatus, error.message, true);
    } finally {
      transcribeButton.disabled = false;
    }
  }

  transcribeButton.addEventListener("click", () => {
    const file = byId("transcribe-file").files[0];
    if (!file) return setStatus(transcribeStatus, "اختار ملف الأول، أو سجّل من المايك.", true);
    transcribe(file, file.name);
  });

  const recorder = new MicrophoneRecorder(({ blob, filename }) => {
    recordButton.textContent = "ابدأ التسجيل";
    recordButton.classList.remove("recording");
    transcribe(blob, filename);
  });

  recordButton.addEventListener("click", async () => {
    if (recorder.isRecording) return recorder.stop();
    try {
      await recorder.start();
      recordButton.textContent = "وقّف وفرّغ";
      recordButton.classList.add("recording");
      setStatus(transcribeStatus, "بيسجّل... دوس تاني لما تخلص.");
    } catch (error) {
      setStatus(transcribeStatus, `مقدرش أفتح المايك: ${error.message}`, true);
    }
  });

  // Text to speech
  const speakStatus = byId("speak-status");
  const speakButton = byId("speak-button");
  const speakPlayer = byId("speak-player");
  const speakDownload = byId("speak-download");
  const speakTranscribe = byId("speak-transcribe");
  let audioUrl = null;
  let generatedSpeech = null;

  // Round trip: send the generated speech to the speech-to-text panel.
  speakTranscribe.addEventListener("click", () => {
    if (generatedSpeech) transcribe(generatedSpeech.blob, generatedSpeech.filename);
  });

  speakButton.addEventListener("click", async () => {
    const format = byId("speak-format").value;
    speakButton.disabled = true;
    setStatus(speakStatus, "بيولّد الصوت...");
    try {
      const response = await fetch("/v1/speak", {
        method: "POST",
        headers: { ...authHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({
          text: byId("speak-text").value,
          language: byId("speak-language").value,
          voice: byId("speak-voice").value || null,
          format,
        }),
      });
      if (!response.ok) throw new Error(await errorMessage(response));
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      const blob = await response.blob();
      generatedSpeech = { blob, filename: `speech.${format}` };
      audioUrl = URL.createObjectURL(blob);
      speakTranscribe.hidden = false;
      speakPlayer.src = audioUrl;
      speakPlayer.hidden = false;
      speakPlayer.play().catch(() => {});
      speakDownload.href = audioUrl;
      speakDownload.download = `speech.${format}`;
      speakDownload.hidden = false;
      const seconds = response.headers.get("X-Audio-Seconds");
      const processing = (Number(response.headers.get("X-Processing-Ms")) / 1000).toFixed(1);
      setStatus(speakStatus, `${response.headers.get("X-Engine")} · ${response.headers.get("X-Voice")} · صوت ${seconds} ث · معالجة ${processing} ث`);
    } catch (error) {
      setStatus(speakStatus, error.message, true);
    } finally {
      speakButton.disabled = false;
    }
  });
</script>
</body>
</html>
